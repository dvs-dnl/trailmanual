<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Toyota Tacoma">
  <!-- Body — truck proportions, slightly lower than 4Runner -->
  <path d="M6,128 L6,20 Q6,12 16,12 L184,12 Q194,12 194,20 L194,128"/>
  <!-- Bumper -->
  <path d="M3,128 Q3,144 16,144 L184,144 Q197,144 197,128 Z"/>
  <!-- Hood line -->
  <line x1="6" y1="66" x2="194" y2="66"/>
  <!-- Left headlight — more angular/swept-back than 4Runner -->
  <path d="M8,14 L54,14 L54,46 Q54,52 48,52 L8,42 Z"/>
  <path d="M12,18 L50,18 L50,44 Q50,48 46,48 L12,40 Z"/>
  <!-- Right headlight -->
  <path d="M192,14 L146,14 L146,46 Q146,52 152,52 L192,42 Z"/>
  <path d="M188,18 L150,18 L150,44 Q150,48 154,48 L188,40 Z"/>
  <!-- Grille surround -->
  <rect x="56" y="12" width="88" height="52" rx="3"/>
  <!-- Toyota T logo -->
  <line x1="74" y1="30" x2="126" y2="30"/>
  <line x1="100" y1="30" x2="100" y2="52"/>
  <ellipse cx="100" cy="40" rx="24" ry="16"/>
  <!-- Honeycomb/mesh area below logo -->
  <line x1="60" y1="42" x2="140" y2="42"/>
  <line x1="60" y1="50" x2="140" y2="50"/>
  <line x1="60" y1="58" x2="140" y2="58"/>
  <!-- Lower bumper — truck style, more angular -->
  <rect x="6" y="66" width="188" height="20" rx="2"/>
  <!-- Bumper lower opening/skid -->
  <rect x="38" y="68" width="124" height="16" rx="2"/>
  <!-- Tow hooks / bumper corners -->
  <rect x="8"   y="68" width="28" height="12" rx="1"/>
  <rect x="164" y="68" width="28" height="12" rx="1"/>
  <!-- License plate -->
  <rect x="78" y="130" width="44" height="10" rx="1"/>
</svg>