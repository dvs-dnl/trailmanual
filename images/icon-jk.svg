<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Jeep Wrangler JK">
  <!-- Body — slightly wider than TJ -->
  <path d="M7,130 L7,22 Q7,14 16,14 L184,14 Q193,14 193,22 L193,130"/>
  <!-- Bumper -->
  <path d="M4,130 Q4,144 15,144 L185,144 Q196,144 196,130 Z"/>
  <!-- Hood line -->
  <line x1="7" y1="62" x2="193" y2="62"/>
  <!-- Left round headlight -->
  <circle cx="32" cy="37" r="19"/>
  <circle cx="32" cy="37" r="12"/>
  <!-- Right round headlight -->
  <circle cx="168" cy="37" r="19"/>
  <circle cx="168" cy="37" r="12"/>
  <!-- Grille surround -->
  <rect x="54" y="15" width="92" height="46" rx="3"/>
  <!-- 7 vertical rounded-rect grille slots (JK is slightly wider) -->
  <rect x="58"  y="19" width="8" height="38" rx="4"/>
  <rect x="70"  y="19" width="8" height="38" rx="4"/>
  <rect x="82"  y="19" width="8" height="38" rx="4"/>
  <rect x="96"  y="19" width="8" height="38" rx="4"/>
  <rect x="110" y="19" width="8" height="38" rx="4"/>
  <rect x="122" y="19" width="8" height="38" rx="4"/>
  <rect x="134" y="19" width="8" height="38" rx="4"/>
  <!-- Indicator/turn signal strips -->
  <rect x="10"  y="60" width="30" height="6" rx="1"/>
  <rect x="160" y="60" width="30" height="6" rx="1"/>
  <!-- Front skid/lower body -->
  <line x1="7" y1="96" x2="193" y2="96"/>
  <!-- Tow hooks -->
  <path d="M16,96 L16,110 Q16,116 22,116"/>
  <path d="M184,96 L184,110 Q184,116 178,116"/>
  <!-- License plate -->
  <rect x="78" y="132" width="44" height="10" rx="1"/>
</svg>