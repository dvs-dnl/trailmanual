<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Ford F-150 Raptor">
  <!-- Body — very wide, lower profile, truck -->
  <path d="M4,124 L4,24 Q4,14 16,14 L184,14 Q196,14 196,24 L196,124"/>
  <!-- Bumper — wide, lower, more pronounced -->
  <path d="M1,124 Q1,142 14,142 L186,142 Q199,142 199,124 Z"/>
  <!-- Hood line — wide flat hood -->
  <line x1="4" y1="60" x2="196" y2="60"/>
  <!-- Left headlight — rectangular, inset (Raptor Gen2 style) -->
  <rect x="8" y="18" width="48" height="38" rx="3"/>
  <rect x="12" y="22" width="40" height="30" rx="2"/>
  <!-- Inner DRL/running light strip -->
  <line x1="14" y1="26" x2="50" y2="26"/>
  <!-- Right headlight -->
  <rect x="144" y="18" width="48" height="38" rx="3"/>
  <rect x="148" y="22" width="40" height="30" rx="2"/>
  <line x1="150" y1="26" x2="186" y2="26"/>
  <!-- Upper grille — open mesh area with FORD lettering -->
  <rect x="60" y="16" width="80" height="22" rx="2"/>
  <!-- FORD text simplified as 4 vertical bars -->
  <line x1="70" y1="19" x2="70" y2="35"/>
  <line x1="80" y1="19" x2="80" y2="35"/>
  <line x1="104" y1="19" x2="104" y2="35"/>
  <line x1="120" y1="19" x2="120" y2="35"/>
  <!-- Horizontal bars to form FORD letters -->
  <line x1="70" y1="19" x2="78" y2="19"/>
  <line x1="70" y1="27" x2="77" y2="27"/>
  <line x1="84" y1="19" x2="84" y2="35"/>
  <line x1="84" y1="27" x2="90" y2="27"/>
  <line x1="94" y1="19" x2="102" y2="27"/>
  <line x1="102" y1="27" x2="94" y2="35"/>
  <line x1="108" y1="19" x2="118" y2="19"/>
  <line x1="108" y1="27" x2="118" y2="27"/>
  <!-- Lower grille opening (Raptor has large open lower grille) -->
  <rect x="56" y="40" width="88" height="20" rx="2"/>
  <!-- Fender flare lines (Raptor signature — very wide) -->
  <path d="M4,24 Q2,14 8,10"/>
  <path d="M196,24 Q198,14 192,10"/>
  <!-- Lower bumper structure -->
  <rect x="4" y="60" width="192" height="18" rx="2"/>
  <!-- Skid plate / lower protection -->
  <rect x="30" y="76" width="140" height="16" rx="3"/>
  <!-- Tow hooks — Raptor has prominent tow hooks -->
  <path d="M8,76 Q4,76 4,82 Q4,88 10,88"/>
  <path d="M192,76 Q196,76 196,82 Q196,88 190,88"/>
  <!-- License plate -->
  <rect x="78" y="128" width="44" height="10" rx="1"/>
</svg>