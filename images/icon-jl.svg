<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Jeep Wrangler JL">
  <!-- Body — wider, lower stance than JK -->
  <path d="M5,128 L5,22 Q5,14 15,14 L185,14 Q195,14 195,22 L195,128"/>
  <!-- Bumper -->
  <path d="M2,128 Q2,144 14,144 L186,144 Q198,144 198,128 Z"/>
  <!-- Hood line -->
  <line x1="5" y1="64" x2="195" y2="64"/>
  <!-- Left headlight cluster — JL has modern teardrop-round shape -->
  <circle cx="30" cy="38" r="20"/>
  <circle cx="30" cy="38" r="13"/>
  <!-- Small DRL strip above headlight (JL signature detail) -->
  <path d="M14,20 Q30,17 46,20" stroke-width="2.5"/>
  <!-- Right headlight -->
  <circle cx="170" cy="38" r="20"/>
  <circle cx="170" cy="38" r="13"/>
  <path d="M154,20 Q170,17 186,20" stroke-width="2.5"/>
  <!-- Grille surround — JL grille is slightly more defined -->
  <rect x="53" y="15" width="94" height="48" rx="4"/>
  <!-- 7 grille slots (JL slightly trapezoidal) -->
  <rect x="57"  y="19" width="8" height="40" rx="4"/>
  <rect x="69"  y="19" width="8" height="40" rx="4"/>
  <rect x="81"  y="19" width="8" height="40" rx="4"/>
  <rect x="96"  y="19" width="8" height="40" rx="4"/>
  <rect x="111" y="19" width="8" height="40" rx="4"/>
  <rect x="123" y="19" width="8" height="40" rx="4"/>
  <rect x="135" y="19" width="8" height="40" rx="4"/>
  <!-- Bumper side openings -->
  <rect x="8"   y="64" width="32" height="14" rx="2"/>
  <rect x="160" y="64" width="32" height="14" rx="2"/>
  <!-- Front skid plate line -->
  <line x1="5" y1="98" x2="195" y2="98"/>
  <!-- License plate -->
  <rect x="78" y="130" width="44" height="10" rx="1"/>
</svg>