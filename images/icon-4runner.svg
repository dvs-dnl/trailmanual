<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Toyota 4Runner">
  <!-- Body — boxy SUV, taller than Wranglers -->
  <path d="M6,130 L6,18 Q6,10 16,10 L184,10 Q194,10 194,18 L194,130"/>
  <!-- Bumper -->
  <path d="M3,130 Q3,146 16,146 L184,146 Q197,146 197,130 Z"/>
  <!-- Hood line — higher (taller grill area) -->
  <line x1="6" y1="70" x2="194" y2="70"/>
  <!-- Left headlight — rectangular (4Runner style) -->
  <rect x="8" y="14" width="46" height="24" rx="2"/>
  <rect x="12" y="18" width="38" height="16" rx="1"/>
  <!-- Right headlight -->
  <rect x="146" y="14" width="46" height="24" rx="2"/>
  <rect x="150" y="18" width="38" height="16" rx="1"/>
  <!-- Grille surround -->
  <rect x="58" y="12" width="84" height="56" rx="3"/>
  <!-- Toyota T logo (center of grille) — simplified -->
  <!-- T crossbar -->
  <line x1="76" y1="32" x2="124" y2="32"/>
  <!-- T stem -->
  <line x1="100" y1="32" x2="100" y2="55"/>
  <!-- Oval surrounding logo -->
  <ellipse cx="100" cy="42" rx="26" ry="18"/>
  <!-- Vertical grille slats (left and right of logo) -->
  <line x1="66" y1="16" x2="66" y2="64"/>
  <line x1="72" y1="16" x2="72" y2="64"/>
  <line x1="128" y1="16" x2="128" y2="64"/>
  <line x1="134" y1="16" x2="134" y2="64"/>
  <!-- Lower bumper fascia -->
  <rect x="6" y="70" width="188" height="22" rx="2"/>
  <!-- Fog lights -->
  <rect x="14" y="74" width="26" height="14" rx="2"/>
  <rect x="160" y="74" width="26" height="14" rx="2"/>
  <!-- Skid plate -->
  <line x1="6" y1="92" x2="194" y2="92"/>
  <!-- License plate -->
  <rect x="78" y="132" width="44" height="10" rx="1"/>
</svg>