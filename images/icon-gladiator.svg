<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Jeep Gladiator JT">
  <!-- Body — longer than JL (pickup proportion) -->
  <path d="M5,124 L5,18 Q5,10 15,10 L185,10 Q195,10 195,18 L195,124"/>
  <!-- Bumper -->
  <path d="M2,124 Q2,140 14,140 L186,140 Q198,140 198,124 Z"/>
  <!-- Hood line — higher up, longer hood -->
  <line x1="5" y1="55" x2="195" y2="55"/>
  <!-- Left headlight (JL-style round) -->
  <circle cx="30" cy="33" r="18"/>
  <circle cx="30" cy="33" r="11"/>
  <path d="M14,15 Q30,12 46,15" stroke-width="2.5"/>
  <!-- Right headlight -->
  <circle cx="170" cy="33" r="18"/>
  <circle cx="170" cy="33" r="11"/>
  <path d="M154,15 Q170,12 186,15" stroke-width="2.5"/>
  <!-- Grille (JL/JT 7-slot) -->
  <rect x="52" y="12" width="96" height="42" rx="4"/>
  <rect x="56"  y="16" width="8" height="34" rx="4"/>
  <rect x="68"  y="16" width="8" height="34" rx="4"/>
  <rect x="80"  y="16" width="8" height="34" rx="4"/>
  <rect x="96"  y="16" width="8" height="34" rx="4"/>
  <rect x="112" y="16" width="8" height="34" rx="4"/>
  <rect x="124" y="16" width="8" height="34" rx="4"/>
  <rect x="136" y="16" width="8" height="34" rx="4"/>
  <!-- Bumper openings (wider/truck-style) -->
  <rect x="8"   y="55" width="34" height="15" rx="2"/>
  <rect x="158" y="55" width="34" height="15" rx="2"/>
  <!-- Truck bed line (cab-to-bed) — Gladiator JT distinguisher -->
  <line x1="5" y1="90" x2="195" y2="90"/>
  <!-- Front skid plate -->
  <line x1="5" y1="100" x2="195" y2="100"/>
  <!-- License plate -->
  <rect x="78" y="126" width="44" height="10" rx="1"/>
  <!-- Tow hooks -->
  <path d="M14,100 L14,114 Q14,120 20,120"/>
  <path d="M186,100 L186,114 Q186,120 180,120"/>
</svg>