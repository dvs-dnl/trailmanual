<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Ram Power Wagon">
  <!-- Body — wide, tall truck front -->
  <path d="M5,126 L5,22 Q5,12 16,12 L184,12 Q195,12 195,22 L195,126"/>
  <!-- Bumper — big truck, recessed center -->
  <path d="M2,126 Q2,144 16,144 L184,144 Q198,144 198,126 Z"/>
  <!-- Hood line -->
  <line x1="5" y1="62" x2="195" y2="62"/>
  <!-- Left headlight — rectangular cluster, Ram-style -->
  <rect x="8" y="16" width="50" height="42" rx="3"/>
  <rect x="12" y="20" width="42" height="34" rx="2"/>
  <!-- Inner accent line (Ram headlight detail) -->
  <line x1="14" y1="24" x2="52" y2="24"/>
  <!-- Right headlight -->
  <rect x="142" y="16" width="50" height="42" rx="3"/>
  <rect x="146" y="20" width="42" height="34" rx="2"/>
  <line x1="148" y1="24" x2="186" y2="24"/>
  <!-- Main grille surround — RAM grille is wide, spans most of face -->
  <rect x="62" y="14" width="76" height="46" rx="3"/>
  <!-- Crosshatch grille pattern — horizontal bars -->
  <line x1="65" y1="22" x2="135" y2="22"/>
  <line x1="65" y1="30" x2="135" y2="30"/>
  <line x1="65" y1="38" x2="135" y2="38"/>
  <line x1="65" y1="46" x2="135" y2="46"/>
  <line x1="65" y1="54" x2="135" y2="54"/>
  <!-- Vertical bars -->
  <line x1="80"  y1="14" x2="80"  y2="60"/>
  <line x1="96"  y1="14" x2="96"  y2="60"/>
  <line x1="100" y1="14" x2="100" y2="60"/>
  <line x1="104" y1="14" x2="104" y2="60"/>
  <line x1="120" y1="14" x2="120" y2="60"/>
  <!-- RAM badge (simplified ram head / text area) -->
  <ellipse cx="100" cy="37" rx="14" ry="10"/>
  <!-- Ram horns suggestion -->
  <path d="M86,34 Q80,26 76,30 Q72,34 80,38"/>
  <path d="M114,34 Q120,26 124,30 Q128,34 120,38"/>
  <!-- Lower bumper structure (Power Wagon has big steel bumper) -->
  <rect x="5" y="62" width="190" height="20" rx="2"/>
  <!-- Winch/skid plate center -->
  <rect x="36" y="64" width="128" height="16" rx="2"/>
  <!-- Tow hooks (big, prominent) -->
  <rect x="8"   y="66" width="24" height="12" rx="2"/>
  <rect x="168" y="66" width="24" height="12" rx="2"/>
  <!-- Skid plate line -->
  <line x1="5" y1="96" x2="195" y2="96"/>
  <!-- License plate -->
  <rect x="78" y="130" width="44" height="10" rx="1"/>
</svg>