<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 96" role="img" aria-label="Jeep Wrangler">
  <!-- Body shell -->
  <rect x="2" y="8" width="84" height="74" rx="3" fill="#1A2330"/>

  <!-- Round headlights (Wrangler signature) -->
  <!-- Left headlight bezel -->
  <circle cx="18" cy="26" r="13" fill="#C97E50"/>
  <circle cx="18" cy="26" r="9" fill="#A86038"/>
  <!-- Right headlight bezel -->
  <circle cx="70" cy="26" r="13" fill="#C97E50"/>
  <circle cx="70" cy="26" r="9" fill="#A86038"/>

  <!-- 7-slot Wrangler grille -->
  <rect x="32" y="12" width="24" height="34" rx="1" fill="#0F1820"/>
  <!-- 7 vertical slots -->
  <rect x="33.5" y="14" width="2.5" height="28" rx="1" fill="#F7F4ED"/>
  <rect x="37.5" y="14" width="2.5" height="28" rx="1" fill="#F7F4ED"/>
  <rect x="41.5" y="14" width="2.5" height="28" rx="1" fill="#F7F4ED"/>
  <rect x="45.5" y="14" width="2.5" height="28" rx="1" fill="#F7F4ED"/>
  <rect x="49.5" y="14" width="2.5" height="28" rx="1" fill="#F7F4ED"/>
  <rect x="53.5" y="14" width="2.5" height="28" rx="1" fill="#F7F4ED"/>

  <!-- Grille surround -->
  <rect x="32" y="12" width="24" height="34" rx="1" fill="none" stroke="#2B3A4A" stroke-width="1.5"/>

  <!-- Lower air dam -->
  <rect x="2" y="46" width="84" height="12" rx="0" fill="#0F1820"/>

  <!-- Flat bumper (Wrangler style — straight across) -->
  <rect x="0" y="58" width="88" height="9" rx="1" fill="#0A1218"/>
  <!-- D-ring / shackle mounts -->
  <rect x="5" y="56" width="7" height="6" rx="1" fill="#0A1218"/>
  <rect x="76" y="56" width="7" height="6" rx="1" fill="#0A1218"/>

  <!-- Lower body -->
  <rect x="2" y="67" width="84" height="15" rx="2" fill="#1A2330"/>
</svg>
