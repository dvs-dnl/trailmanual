<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 92" role="img" aria-label="Early Ford Bronco">
  <!-- Body shell -->
  <rect x="2" y="6" width="96" height="74" rx="3" fill="#1A2330"/>

  <!-- Fender-top turn signals (distinctive Bronco detail) -->
  <rect x="4" y="6" width="15" height="7" rx="1" fill="#C97E50"/>
  <rect x="81" y="6" width="15" height="7" rx="1" fill="#C97E50"/>

  <!-- Square headlight bezels -->
  <rect x="5" y="15" width="22" height="22" rx="1" fill="#C97E50"/>
  <rect x="73" y="15" width="22" height="22" rx="1" fill="#C97E50"/>
  <!-- Headlight lens (darker inner) -->
  <rect x="7" y="17" width="18" height="16" rx="0" fill="#A86038"/>
  <rect x="75" y="17" width="18" height="16" rx="0" fill="#A86038"/>

  <!-- Grille area — 4 horizontal bars -->
  <rect x="31" y="15" width="38" height="4" rx="1" fill="#F7F4ED"/>
  <rect x="31" y="22" width="38" height="4" rx="1" fill="#F7F4ED"/>
  <rect x="31" y="29" width="38" height="4" rx="1" fill="#F7F4ED"/>
  <rect x="31" y="36" width="38" height="4" rx="1" fill="#F7F4ED"/>

  <!-- Grille surround (dark border around bars) -->
  <rect x="29" y="13" width="42" height="30" rx="1" fill="none" stroke="#2B3A4A" stroke-width="1.5"/>

  <!-- Lower valance / air dam -->
  <rect x="2" y="42" width="96" height="14" rx="0" fill="#0F1820"/>

  <!-- Bumper -->
  <rect x="0" y="56" width="100" height="9" rx="2" fill="#0F1820"/>
  <!-- Tow hook left -->
  <rect x="6" y="55" width="8" height="5" rx="1" fill="#0A1218"/>
  <!-- Tow hook right -->
  <rect x="86" y="55" width="8" height="5" rx="1" fill="#0A1218"/>

  <!-- Skid plate / lower body -->
  <rect x="2" y="65" width="96" height="15" rx="2" fill="#1A2330"/>

  <!-- Windshield hint (upper cutout) -->
  <rect x="12" y="7" width="76" height="3" rx="1" fill="#2B3A4A" opacity="0.5"/>
</svg>
