<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Ford Bronco Early">
  <!-- Body — extremely boxy/flat rectangle, vintage proportions -->
  <rect x="8" y="16" width="184" height="116" rx="4"/>
  <!-- Bumper -->
  <rect x="4" y="132" width="192" height="16" rx="4"/>
  <!-- Hood line (very flat, wide, near-centered) -->
  <line x1="8" y1="66" x2="192" y2="66"/>
  <!-- Left headlight: round light in SQUARE housing (Early Bronco signature) -->
  <rect x="12" y="20" width="44" height="42" rx="2"/>
  <circle cx="34" cy="41" r="16"/>
  <!-- Right headlight: round in square -->
  <rect x="144" y="20" width="44" height="42" rx="2"/>
  <circle cx="166" cy="41" r="16"/>
  <!-- Grille area — simple horizontal bars -->
  <rect x="60" y="20" width="80" height="44" rx="2"/>
  <!-- Horizontal bars (early Bronco grille was simple) -->
  <line x1="63" y1="30" x2="137" y2="30"/>
  <line x1="63" y1="38" x2="137" y2="38"/>
  <line x1="63" y1="46" x2="137" y2="46"/>
  <line x1="63" y1="54" x2="137" y2="54"/>
  <!-- Ford oval badge centered -->
  <ellipse cx="100" cy="23" rx="16" ry="6"/>
  <!-- Lower body: flat panel -->
  <line x1="8" y1="100" x2="192" y2="100"/>
  <!-- Bumper bolts/detail -->
  <circle cx="20"  cy="140" r="3"/>
  <circle cx="180" cy="140" r="3"/>
  <!-- License plate -->
  <rect x="76" y="133" width="48" height="12" rx="1"/>
</svg>