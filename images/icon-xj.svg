<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 96" role="img" aria-label="Jeep Cherokee XJ">
  <!-- Body shell -->
  <rect x="2" y="8" width="84" height="76" rx="3" fill="#1A2330"/>

  <!-- Rectangular headlights (XJ signature — long, low, stacked) -->
  <!-- Left headlight cluster -->
  <rect x="4" y="14" width="22" height="10" rx="1" fill="#C97E50"/>
  <rect x="4" y="26" width="22" height="7" rx="1" fill="#C97E50" opacity="0.7"/>
  <!-- Right headlight cluster -->
  <rect x="62" y="14" width="22" height="10" rx="1" fill="#C97E50"/>
  <rect x="62" y="26" width="22" height="7" rx="1" fill="#C97E50" opacity="0.7"/>

  <!-- Grille area — vertical slots (XJ style) -->
  <rect x="28" y="12" width="32" height="32" rx="1" fill="#0F1820"/>
  <!-- Vertical slots -->
  <rect x="30" y="14" width="3" height="26" rx="1" fill="#F7F4ED"/>
  <rect x="35" y="14" width="3" height="26" rx="1" fill="#F7F4ED"/>
  <rect x="40" y="14" width="3" height="26" rx="1" fill="#F7F4ED"/>
  <rect x="45" y="14" width="3" height="26" rx="1" fill="#F7F4ED"/>
  <rect x="50" y="14" width="3" height="26" rx="1" fill="#F7F4ED"/>
  <rect x="55" y="14" width="3" height="26" rx="1" fill="#F7F4ED"/>

  <!-- Grille outline / surround -->
  <rect x="28" y="12" width="32" height="32" rx="1" fill="none" stroke="#2B3A4A" stroke-width="1.5"/>

  <!-- Lower air dam -->
  <rect x="2" y="44" width="84" height="12" rx="0" fill="#0F1820"/>

  <!-- Bumper -->
  <rect x="0" y="56" width="88" height="8" rx="2" fill="#0F1820"/>

  <!-- Lower body / skid plate -->
  <rect x="2" y="64" width="84" height="20" rx="2" fill="#1A2330"/>

  <!-- License plate recess -->
  <rect x="34" y="66" width="20" height="12" rx="1" fill="#0F1820"/>
</svg>
