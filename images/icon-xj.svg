<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Jeep Cherokee XJ">
  <!-- Outer body shell -->
  <path d="M6,128 L6,22 Q6,14 14,14 L186,14 Q194,14 194,22 L194,128"/>
  <!-- Bumper -->
  <path d="M3,128 Q3,144 14,144 L186,144 Q197,144 197,128 Z"/>
  <!-- Hood line -->
  <line x1="6" y1="56" x2="194" y2="56"/>
  <!-- Left headlight — TOP rectangle (XJ stacked signature) -->
  <rect x="10" y="18" width="38" height="16" rx="1"/>
  <!-- Left headlight — BOTTOM rectangle -->
  <rect x="10" y="36" width="38" height="14" rx="1"/>
  <!-- Right headlight — TOP -->
  <rect x="152" y="18" width="38" height="16" rx="1"/>
  <!-- Right headlight — BOTTOM -->
  <rect x="152" y="36" width="38" height="14" rx="1"/>
  <!-- Grille surround box -->
  <rect x="52" y="16" width="96" height="38" rx="2"/>
  <!-- 7 vertical grille slots -->
  <line x1="64"  y1="20" x2="64"  y2="50"/>
  <line x1="77"  y1="20" x2="77"  y2="50"/>
  <line x1="90"  y1="20" x2="90"  y2="50"/>
  <line x1="100" y1="20" x2="100" y2="50"/>
  <line x1="110" y1="20" x2="110" y2="50"/>
  <line x1="123" y1="20" x2="123" y2="50"/>
  <line x1="136" y1="20" x2="136" y2="50"/>
  <!-- Vertical dividers between headlights and grille -->
  <line x1="52"  y1="14" x2="52"  y2="56"/>
  <line x1="148" y1="14" x2="148" y2="56"/>
  <!-- Air dam / lower valance -->
  <rect x="6" y="56" width="188" height="20" rx="1"/>
  <!-- Fog lights in bumper -->
  <rect x="16" y="131" width="24" height="8" rx="1"/>
  <rect x="160" y="131" width="24" height="8" rx="1"/>
  <!-- License plate -->
  <rect x="80" y="130" width="40" height="10" rx="1"/>
</svg>