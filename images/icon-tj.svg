<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Jeep Wrangler TJ">
  <!-- Outer body — squarer/taller face than XJ -->
  <path d="M10,132 L10,24 Q10,16 20,16 L180,16 Q190,16 190,24 L190,132"/>
  <!-- Bumper -->
  <path d="M6,132 Q6,146 18,146 L182,146 Q194,146 194,132 Z"/>
  <!-- Hood line -->
  <line x1="10" y1="62" x2="190" y2="62"/>
  <!-- Left round headlight (TJ signature) -->
  <circle cx="34" cy="38" r="18"/>
  <circle cx="34" cy="38" r="11"/>
  <!-- Right round headlight -->
  <circle cx="166" cy="38" r="18"/>
  <circle cx="166" cy="38" r="11"/>
  <!-- Grille surround (trapezoid-ish rect) -->
  <rect x="56" y="17" width="88" height="44" rx="3"/>
  <!-- 7 oval-ish vertical grille slots -->
  <rect x="60"  y="21" width="8"  height="36" rx="4"/>
  <rect x="72"  y="21" width="8"  height="36" rx="4"/>
  <rect x="84"  y="21" width="8"  height="36" rx="4"/>
  <rect x="96"  y="21" width="8"  height="36" rx="4"/>
  <rect x="108" y="21" width="8"  height="36" rx="4"/>
  <rect x="120" y="21" width="8"  height="36" rx="4"/>
  <rect x="132" y="21" width="8"  height="36" rx="4"/>
  <!-- Turn signals below headlights -->
  <rect x="14"  y="59" width="28" height="8" rx="1"/>
  <rect x="158" y="59" width="28" height="8" rx="1"/>
  <!-- Lower bumper detail -->
  <line x1="10" y1="100" x2="190" y2="100"/>
  <!-- Tow hooks -->
  <path d="M14,100 L14,112 Q14,118 20,118"/>
  <path d="M186,100 L186,112 Q186,118 180,118"/>
  <!-- License plate -->
  <rect x="78" y="132" width="44" height="10" rx="1"/>
  <!-- Windshield frame hint -->
  <rect x="28" y="16" width="14" height="10" rx="1" opacity="0.5"/>
  <rect x="158" y="16" width="14" height="10" rx="1" opacity="0.5"/>
</svg>