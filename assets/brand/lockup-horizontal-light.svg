<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" role="img" aria-label="Trail Manual">
  <title>Trail Manual</title>
  <!-- Mark on the left at 64x64 -->
  <g>
    <rect x="2" y="2" width="60" height="60" rx="6" fill="none" stroke="#2B3A4A" stroke-width="2"/>
    <polyline points="10,48 22,32 30,40 44,22 54,32" fill="none" stroke="#2B3A4A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="10,54 24,38 32,46 46,28 54,38" fill="none" stroke="#C97E50" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Wordmark to the right -->
  <g transform="translate(88,42)" font-family="DM Sans, system-ui, sans-serif" font-weight="500" font-size="26" letter-spacing="4.7">
    <text fill="#2B3A4A">TRAIL</text>
    <text x="86" fill="#C97E50">·</text>
    <text x="100" fill="#2B3A4A">MANUAL</text>
  </g>
</svg>
